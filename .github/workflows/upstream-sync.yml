name: 手动同步上游仓库（已禁用每日自动同步）

# ⚠️ 本仓库的 custom-nav 分支为生产部署分支（Cloudflare Pages 绑定），包含本地定制代码。
# 自动同步上游会用原项目代码覆盖 master，因此已移除 schedule 触发。
# 如需跟进上游更新：GitHub → Actions →「手动同步上游仓库」→ Run workflow
# （仅合并到 master，不影响线上部署分支 custom-nav）。

permissions:
  contents: write

on:
  workflow_dispatch:

jobs:
  sync_latest_from_upstream:
    name: 自动同步上游仓库
    runs-on: ubuntu-latest
    if: ${{ github.event.repository.fork }}
    env:
      UP_REPO: jy02739244/iori-nav
      UP_BRANCH: master
      MY_BRANCH: master

    steps:
      - name: 检出本仓库
        uses: actions/checkout@v4

      - name: 同步上游仓库
        id: sync
        uses: aormsby/Fork-Sync-With-Upstream-action@v3.4
        with:
          upstream_sync_repo: ${{ env.UP_REPO }}
          upstream_sync_branch: ${{ env.UP_BRANCH }}
          target_sync_branch: ${{ env.MY_BRANCH }}
          target_repo_token: ${{ secrets.GITHUB_TOKEN }} # 无需设置
          test_mode: false

      - name: 检查同步状态
        if: failure()
        run: |
          echo "[Error] 由于上游仓库的 workflow 文件变更，导致 GitHub 自动暂停了本次自动更新，你需要手动 Sync Fork 一次"
          echo "[Error] Due to changes in the workflow file of the upstream repository, GitHub has automatically paused this automatic update. You need to manually Sync Fork once"
          exit 1
